# Pod that reads the Secret "yatri-db-secret" as env vars and as files.
# Kubernetes decodes the base64 values before giving them to the container.
# Kiran N | Roll No: 10446
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  labels:
    app: secret-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"secret-demo started by Kiran N (10446): DB user is $DB_USER\"; sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_PASSWORD
      volumeMounts:
        - name: db-secret-volume
          mountPath: /etc/db-secret
          readOnly: true
  volumes:
    - name: db-secret-volume
      secret:
        secretName: yatri-db-secret
        defaultMode: 0400                   # files readable only by the owner
