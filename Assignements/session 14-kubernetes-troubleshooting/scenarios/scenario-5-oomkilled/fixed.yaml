# FIX for scenario 5: the code allocates 100 x 10 MB = 1000 MB but the limit is 20Mi,
# so the kernel kills it (OOMKilled, exit code 137).
# 1. allocate a sane amount (10 x 10 MB = 100 MB)
# 2. set a memory limit above what the app really uses (256Mi), with a request
# 3. keep the process running
# Kiran N | Roll No: 10446
apiVersion: v1
kind: Pod
metadata:
  name: fail-5-oomkilled-pod
  labels:
    tier: triage-gauntlet
    scenario: oomkilled
spec:
  containers:
    - name: memory-leaker
      image: python:3.11-alpine
      command:
        - "python3"
        - "-c"
        - |
          import time
          print("Allocating 100 MB (fixed by Kiran N - 10446)...", flush=True)
          chunks = []
          for i in range(10):
              chunks.append(b"x" * (10 * 1024 * 1024))
          print("Allocated", len(chunks) * 10, "MB, running fine", flush=True)
          while True:
              time.sleep(60)
      resources:
        requests:
          memory: "128Mi"
        limits:
          memory: "256Mi"
