# Secret scanning - Gitleaks settings (Kiran N | 10446)
# Start from the built-in rules (AWS keys, GitHub tokens, private keys, passwords, ...)
title = "Session 17 gitleaks config"

[extend]
useDefault = true

# Our own rule on top: anything that looks like KEY/TOKEN/SECRET = "long value" in Python or YAML
[[rules]]
id = "kiran-generic-assignment"
description = "Hard-coded secret assigned in code"
regex = '''(?i)(api[_-]?key|secret|token|passwd|password)\s*[:=]\s*["'][A-Za-z0-9/+_\-]{16,}["']'''
keywords = ["key", "secret", "token", "passwd", "password"]

[allowlist]
description = "Files that are not source code"
paths = ['''\.coverage$''', '''security/gitleaks\.toml$''']
