# Pod that writes into the static PV (hostPath /tmp/student-data on the node).
# Kiran N | Roll No: 10446
apiVersion: v1
kind: Pod
metadata:
  name: static-pv-demo
spec:
  containers:
    - name: app
      image: nginx:1.27
      volumeMounts:
        - name: student-volume
          mountPath: /data
  volumes:
    - name: student-volume
      persistentVolumeClaim:
        claimName: student-static-pvc
