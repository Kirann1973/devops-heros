apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-rolling
  labels:
    app: app-rolling
spec:
  replicas: 4
  selector:
    matchLabels:
      app: app-rolling
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: app-rolling
        version: v4
    spec:
      containers:
        - name: web
          image: nginx:1.25
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      initContainers:
        - name: init-html
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cat <<'EOF' > /html/index.html
              <!DOCTYPE html>
              <html>
              <head><title>App v4</title></head>
              <body style="background:#2d1b69;color:#e0e0e0;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
                <div style="text-align:center;">
                  <h1>🚀 Rolling Update Demo</h1>
                  <p>VERSION: v4</p>
                  <p style="color:#bb86fc;">⚡ Aggressive Rollout (maxSurge:2, maxUnavailable:1)</p>
                </div>
              </body>
              </html>
              EOF
          volumeMounts:
            - name: html
              mountPath: /html
      volumes:
        - name: html
          emptyDir: {}
