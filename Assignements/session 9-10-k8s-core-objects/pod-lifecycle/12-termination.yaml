apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-termination
  labels:
    app: lifecycle-lab
    demo: termination
spec:
  terminationGracePeriodSeconds: 30
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          trap 'echo "Received SIGTERM — performing cleanup..."; sleep 3; echo "Cleanup done. Exiting."; exit 0' TERM

          echo "Application started (PID $$)"
          while true; do
            echo "[$(date)] Application running..."
            sleep 5
          done
