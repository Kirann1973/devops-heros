<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <!-- Kiran N | Roll No: 10446 | Session 19 architecture -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#ffffff"/>
  <text x="440" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">Session 19 - Terraform end-to-end on AWS (Kiran N, Roll No 10446)</text>

  <!-- user + terraform -->
  <rect x="20" y="60" width="150" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="95" y="84" text-anchor="middle" font-weight="bold" fill="#111827">Internet user</text>
  <text x="95" y="102" text-anchor="middle" fill="#374151">browser / curl :80</text>

  <rect x="20" y="420" width="150" height="76" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="95" y="444" text-anchor="middle" font-weight="bold" fill="#4c1d95">Terraform</text>
  <text x="95" y="462" text-anchor="middle" fill="#4c1d95">on my Ubuntu VM</text>
  <text x="95" y="480" text-anchor="middle" fill="#4c1d95">local terraform.tfstate</text>

  <!-- region -->
  <rect x="200" y="50" width="660" height="490" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-dasharray="6 4"/>
  <text x="215" y="72" font-weight="bold" fill="#9a3412">AWS Region ap-south-1 (Mumbai)</text>

  <!-- vpc -->
  <rect x="220" y="85" width="440" height="335" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="235" y="106" font-weight="bold" fill="#1e3a8a">VPC kiran-s19-vpc  10.19.0.0/16</text>

  <!-- igw on vpc edge -->
  <rect x="235" y="118" width="170" height="44" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="320" y="137" text-anchor="middle" font-weight="bold" fill="#1e3a8a">Internet Gateway</text>
  <text x="320" y="153" text-anchor="middle" fill="#1e3a8a">kiran-s19-igw</text>

  <!-- route table -->
  <rect x="440" y="118" width="205" height="62" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="542" y="137" text-anchor="middle" font-weight="bold" fill="#1e3a8a">Route table kiran-s19-public-rt</text>
  <text x="542" y="154" text-anchor="middle" fill="#1e3a8a">10.19.0.0/16 -> local</text>
  <text x="542" y="170" text-anchor="middle" fill="#1e3a8a">0.0.0.0/0 -> IGW</text>

  <!-- subnet -->
  <rect x="235" y="195" width="410" height="210" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="250" y="215" font-weight="bold" fill="#065f46">Public subnet 10.19.1.0/24 (1st AZ, auto public IP)</text>

  <!-- sg + ec2 -->
  <rect x="255" y="228" width="370" height="160" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-dasharray="5 3"/>
  <text x="270" y="247" font-weight="bold" fill="#854d0e">Security group kiran-s19-web-sg</text>
  <text x="270" y="264" fill="#854d0e">in: TCP 80 from 0.0.0.0/0 (no SSH)   out: all</text>

  <rect x="285" y="278" width="310" height="96" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="440" y="299" text-anchor="middle" font-weight="bold" fill="#9a3412">EC2 kiran-s19-web  t3.micro</text>
  <text x="440" y="317" text-anchor="middle" fill="#374151">Amazon Linux 2023 (data.aws_ami)</text>
  <text x="440" y="334" text-anchor="middle" fill="#374151">user_data: nginx + page with my name</text>
  <text x="440" y="351" text-anchor="middle" fill="#374151">IMDSv2 required, gp3 8 GiB encrypted</text>
  <text x="440" y="367" text-anchor="middle" fill="#374151">public IP + private IP 10.19.1.x</text>

  <!-- s3 outside vpc -->
  <rect x="690" y="150" width="155" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="767" y="172" text-anchor="middle" font-weight="bold" fill="#14532d">S3 bucket</text>
  <text x="767" y="190" text-anchor="middle" fill="#14532d">kiran-n-10446-s19-*</text>
  <text x="767" y="214" text-anchor="middle" fill="#14532d">versioning: on</text>
  <text x="767" y="231" text-anchor="middle" fill="#14532d">SSE-S3 AES-256</text>
  <text x="767" y="248" text-anchor="middle" fill="#14532d">public access: blocked</text>
  <text x="767" y="272" text-anchor="middle" fill="#14532d">reports/</text>
  <text x="767" y="288" text-anchor="middle" fill="#14532d">infrastructure.json</text>

  <!-- tags note -->
  <text x="220" y="478" fill="#374151">Default tags on every resource: Owner=Kiran N, RollNo=10446, Project, Environment, ManagedBy</text>
  <text x="220" y="500" fill="#374151">14 resources + 2 data sources | inputs: variables.tf + terraform.tfvars | results: outputs.tf</text>
  <text x="220" y="522" fill="#374151">Order from references: VPC -> subnet / IGW / SG -> route table -> association -> EC2 -> S3 report</text>

  <!-- arrows -->
  <path d="M170,88 C200,88 220,140 233,140" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="178" y="128" fill="#374151" font-size="11">HTTP</text>
  <path d="M405,140 L438,140" fill="none" stroke="#374151" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M625,180 L625,196" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="560" y="192" fill="#374151" font-size="11">associated</text>
  <path d="M170,440 L740,440 Q767,440 767,412 L767,302" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M300,440 L300,390" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="420" y="457" fill="#6d28d9" font-size="11">terraform apply / destroy (AWS API)</text>
  <path d="M595,300 L688,225" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="603" y="322" fill="#15803d" font-size="11">instance details</text>
  <text x="603" y="336" fill="#15803d" font-size="11">written by Terraform</text>
</svg>
