apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-stable
  labels:
    app: myapp-canary
    track: stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: myapp-canary
      track: stable
  template:
    metadata:
      labels:
        app: myapp-canary
        track: stable
        version: v1
    spec:
      containers:
        - name: web
          image: nginx:1.24
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      initContainers:
        - name: init-html
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cat <<'EOF' > /html/index.html
              <!DOCTYPE html>
              <html>
              <head><title>Stable v1</title></head>
              <body style="background:#1a1a2e;color:#e0e0e0;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
                <div style="text-align:center;">
                  <h1>🛡️ STABLE v1</h1>
                  <p style="font-size:1.2em;">Track: stable | Version: v1</p>
                  <p style="color:#74c0fc;">Production — serving 90% of traffic</p>
                </div>
              </body>
              </html>
              EOF
          volumeMounts:
            - name: html
              mountPath: /html
      volumes:
        - name: html
          emptyDir: {}
