# Two containers in one Pod share the same emptyDir volume.
# "writer" appends a line every 5 s, "web" (nginx) serves the same folder.
# Kiran N | Roll No: 10446
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-shared
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"$(date +%T) written by writer container (Kiran N - 10446)\" >> /shared/index.html; sleep 5; done"]
      volumeMounts:
        - name: shared-data
          mountPath: /shared
    - name: web
      image: nginx:1.27
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
  volumes:
    - name: shared-data
      emptyDir: {}
