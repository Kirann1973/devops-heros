# FIX for scenario 1: the app exits because DATABASE_URL is missing.
# 1. add the DATABASE_URL env var
# 2. keep the process running like a real server (a container that exits,
#    even with code 0, is restarted again and again by restartPolicy: Always)
# Kiran N | Roll No: 10446
apiVersion: v1
kind: Pod
metadata:
  name: fail-1-crashloop-pod
  labels:
    tier: triage-gauntlet
    scenario: crashloop
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      env:
        - name: DATABASE_URL
          value: "postgresql://yatri_admin@postgres-db.production.svc.cluster.local:5432/yatri"
      command:
        - "python3"
        - "-c"
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully! (fixed by Kiran N - 10446)", flush=True)
          print("DATABASE_URL =", db_url, flush=True)
          while True:
              time.sleep(60)
