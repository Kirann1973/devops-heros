apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-recreate
  labels:
    app: app-recreate
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app-recreate
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: app-recreate
        version: v1
    spec:
      containers:
        - name: web
          image: nginx:1.24
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      initContainers:
        - name: init-html
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cat <<'EOF' > /html/index.html
              <html><body style="background:#1b262c;color:#0f4c81;font-family:monospace;font-size:2.5em;text-align:center;padding-top:20vh">
              <p style="color:#bbe1fa">STRATEGY: RECREATE</p>
              <p style="color:#3282b8">VERSION: v1</p>
              <p style="font-size:0.4em;color:#bbe1fa">All v1 pods will be killed before v2 starts</p>
              </body></html>
              EOF
          volumeMounts:
            - name: html
              mountPath: /html
      volumes:
        - name: html
          emptyDir: {}
