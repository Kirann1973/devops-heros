apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
    spec:
      containers:
        - name: backend
          image: python:3.11-alpine
          command:
            - python3
            - -c
            - |
              import http.server, os

              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain")
                      self.end_headers()
                      body = (
                          "Yatri Backend API\n"
                          "=================\n"
                          f"ENVIRONMENT     : {os.environ.get('ENVIRONMENT', 'N/A')}\n"
                          f"LOG_LEVEL       : {os.environ.get('LOG_LEVEL', 'N/A')}\n"
                          f"DEFAULT_CURRENCY: {os.environ.get('DEFAULT_CURRENCY', 'N/A')}\n"
                          f"POSTGRES_USER   : {os.environ.get('POSTGRES_USER', 'N/A')}\n"
                          f"POSTGRES_DB     : {os.environ.get('POSTGRES_DB', 'N/A')}\n"
                      )
                      self.wfile.write(body.encode())
                  def log_message(self, format, *args):
                      return

              http.server.HTTPServer(("", 5000), Handler).serve_forever()
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: yatri-app-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_DB
---
apiVersion: v1
kind: Service
metadata:
  name: yatri-backend-service
  labels:
    app: yatri-app
spec:
  type: ClusterIP
  selector:
    app: yatri-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
