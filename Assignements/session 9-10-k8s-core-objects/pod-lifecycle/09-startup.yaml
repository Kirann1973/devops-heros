apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-startup
  labels:
    app: lifecycle-lab
    demo: startup
spec:
  containers:
    - name: slow-app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Application initializing..."
          sleep 30
          echo "Application ready"
          touch /tmp/started
          sleep 3600
      startupProbe:
        exec:
          command:
            - cat
            - /tmp/started
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 10
      livenessProbe:
        exec:
          command:
            - cat
            - /tmp/started
        periodSeconds: 5
