# nginx that needs 20 seconds before it starts listening (like a slow Java app).
# The startupProbe gives it up to 30 x 2 = 60 seconds. Until it passes,
# the liveness and readiness probes are not run, so the container is not killed.
# Kiran N | Roll No: 10446
apiVersion: v1
kind: Pod
metadata:
  name: startup-slow-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      command: ["sh", "-c", "echo 'warming up for 20 seconds...'; sleep 20; echo 'starting nginx'; exec nginx -g 'daemon off;'"]
      ports:
        - containerPort: 80
      startupProbe:
        httpGet:
          path: /
          port: 80
        failureThreshold: 30
        periodSeconds: 2
      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
      readinessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
