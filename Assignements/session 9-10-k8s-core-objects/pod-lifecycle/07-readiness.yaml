apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-readiness
  labels:
    app: lifecycle-lab
    demo: readiness
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "App starting..."
          sleep 15
          echo "App is now ready"
          touch /tmp/ready
          sleep 3600
      readinessProbe:
        exec:
          command:
            - cat
            - /tmp/ready
        initialDelaySeconds: 5
        periodSeconds: 3
